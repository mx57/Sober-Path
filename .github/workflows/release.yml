name: "Auto Release on PR Merge"

on:
  push:
    branches: [main, master]
  pull_request:
    types: [closed]
    branches: [main, master]

permissions:
  contents: write
  packages: write

env:
  CI: true
  EXPO_NO_TELEMETRY: 1
  NODE_OPTIONS: "--max_old_space_size=4096"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

jobs:
  # ---------------------------------------------------------------
  # Gate: skip if PR was closed without merge
  # ---------------------------------------------------------------
  check-merge:
    name: Check if PR was merged
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Confirm merge
        run: |
          echo "Trigger event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR #${{ github.event.pull_request.number }} was merged"
          else
            echo "Push to ${{ github.ref_name }} - checking for release"
          fi

  # ---------------------------------------------------------------
  # Extract version from app.json and prepare release body
  # ---------------------------------------------------------------
  prepare-release:
    name: Prepare release metadata
    needs: check-merge
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      body: ${{ steps.meta.outputs.body }}
      is_new_version: ${{ steps.meta.outputs.is_new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and prepare metadata
        id: meta
        run: |
          # Read version from app.json
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # Check if this tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          fi

          MERGE_COMMIT="${{ github.sha }}"
          SHORT_SHA=$(echo "$MERGE_COMMIT" | cut -c1-7)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" "$MERGE_COMMIT")

          # Build release body using a heredoc to avoid shell quoting issues
          cat > /tmp/release_body.md << END_OF_BODY
          ## Sober Path ${TAG}

          ### Changes

          **${COMMIT_MSG}**

          Commit: \`${SHORT_SHA}\`

          ---

          ### System requirements
          - Android 7.0 (API 24) or higher
          - ~50 MB free space
          - Recommended 2+ GB RAM

          ### Links
          - Source code: https://github.com/mx57/Sober-Path
          - Report a bug: https://github.com/mx57/Sober-Path/issues
          - Suggest improvement: https://github.com/mx57/Sober-Path/issues/new?template=feature_request.md

          ---
          Auto-generated release for version ${VERSION}
          END_OF_BODY

          # Store as multiline output
          {
            echo "body<<EOF_MARKER"
            cat /tmp/release_body.md
            echo "EOF_MARKER"
          } >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG}"

  # ---------------------------------------------------------------
  # Build Release APK
  # ---------------------------------------------------------------
  build-apk:
    name: "Build APK"
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Remove deprecated Gradle options
        run: sed -i '/android.useNewApkCreator/d' android/gradle.properties || true

      - name: Patch Gradle repository URL syntax
        run: sed -i 's/url(/url = uri(/g' android/build.gradle && echo "Patched build.gradle"

      - name: Generate debug keystore for release signing
        run: |
          mkdir -p android/app
          rm -f android/app/debug.keystore
          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Ensure Gradle settings
        run: |
          chmod +x android/gradlew
          {
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "android.useAndroidX=true"
            echo "android.enablePngCrunchInReleaseBuilds=true"
          } >> android/gradle.properties

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Collect and copy APK to root directory
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          APK_PATH=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi
          DEST="Sober-Path-v${VERSION}.apk"
          cp "$APK_PATH" "$DEST"
          echo "Built and placed in root: $DEST"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: Sober-Path-v*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------
  # Create GitHub Release with APK
  # ---------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [prepare-release, build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: ./

      - name: List release artifacts
        run: ls -lh Sober-Path-v*.apk

      - name: Delete existing release if tag exists
        if: needs.prepare-release.outputs.is_new_version == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ needs.prepare-release.outputs.tag }}" --yes --cleanup-tag || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sober Path ${{ needs.prepare-release.outputs.tag }}"
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          body: ${{ needs.prepare-release.outputs.body }}
          files: Sober-Path-v*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
